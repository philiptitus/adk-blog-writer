name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        description: Type the environment name again to confirm
        required: true
        type: string

permissions:
  contents: read

jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Verify confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "$CONFIRM" != "$TARGET_ENVIRONMENT" ]; then
            echo "Confirmation text did not match environment name. Aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform init

      - name: Terraform workspace select
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: terraform workspace select "$TARGET_ENVIRONMENT"

      - name: Terraform plan destroy
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: terraform plan -destroy -var-file=terraform.tfvars -var-file="${TARGET_ENVIRONMENT}.tfvars"

      - name: Terraform destroy
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: terraform destroy -auto-approve -var-file=terraform.tfvars -var-file="${TARGET_ENVIRONMENT}.tfvars"
