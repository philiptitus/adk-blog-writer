name: Terraform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PROJECT_ID: fiona-464509
  REGION: us-central1
  REPO: blogger-agent
  GCS_BUCKET_BASE: blogs

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform init

      - name: Terraform workspace select
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform workspace select ${{ steps.env.outputs.name }} || terraform workspace new ${{ steps.env.outputs.name }}

      - name: Terraform plan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform plan -var-file=terraform.tfvars -var-file=${{ steps.env.outputs.name }}.tfvars

      - name: Terraform apply (baseline infra)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform apply -auto-approve -var-file=terraform.tfvars -var-file=${{ steps.env.outputs.name }}.tfvars

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Configure Cloud Run environment
        env:
          GITHUB_PAT: ${{ secrets.BLOGGER_GITHUB_PAT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ENVIRONMENT: ${{ steps.env.outputs.name }}
        run: |
          gcloud run services update "blogger-agent-${ENVIRONMENT}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=True,BLOGGER_GCS_BUCKET=${GCS_BUCKET_BASE}-${ENVIRONMENT},GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT},SERPAPI_API_KEY=${SERPAPI_KEY}"

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/blogger-agent:${{ steps.env.outputs.name }}-${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Terraform apply (deploy image)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform apply -auto-approve -var-file=terraform.tfvars -var-file=${{ steps.env.outputs.name }}.tfvars -var="image=${{ env.IMAGE }}"
