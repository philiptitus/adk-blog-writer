name: Terraform CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PROJECT_ID: fiona-464509
  REGION: us-central1
  REPO: blogger-agent
  GCS_BUCKET_BASE: blogs

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform init

      - name: Terraform workspace select
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform workspace select ${{ steps.env.outputs.name }} || terraform workspace new ${{ steps.env.outputs.name }}

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Migrate legacy Cloud Run secret environment variables
        env:
          GITHUB_PAT: ${{ secrets.BLOGGER_GITHUB_PAT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ENVIRONMENT: ${{ steps.env.outputs.name }}
        run: |
          SERVICE="blogger-agent-${ENVIRONMENT}"
          if SERVICE_INFO="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(metadata.name)' 2>&1)"; then
            gcloud run services update "$SERVICE" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --update-env-vars "GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT},SERPAPI_API_KEY=${SERPAPI_KEY}"
          elif [[ "$SERVICE_INFO" == *"not found"* || "$SERVICE_INFO" == *"NOT_FOUND"* ]]; then
            echo "Cloud Run service does not exist yet; Terraform will create it."
          else
            printf '%s\n' "$SERVICE_INFO" >&2
            exit 1
          fi

      - name: Terraform plan
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform plan -var-file=terraform.tfvars -var-file=${{ steps.env.outputs.name }}.tfvars

      - name: Terraform apply (baseline infra)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform apply -auto-approve -var-file=terraform.tfvars -var-file=${{ steps.env.outputs.name }}.tfvars

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Configure Cloud Run environment
        env:
          GITHUB_PAT: ${{ secrets.BLOGGER_GITHUB_PAT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_API_KEY }}
          ENVIRONMENT: ${{ steps.env.outputs.name }}
        run: |
          BLOG_PUBLISH_URL="$(terraform output -raw blog_publish_url)"
          BLOG_TOKEN_AUDIENCE="$(terraform output -raw blog_token_audience)"
          BLOG_FRONTEND_BASE_URL="$(terraform output -raw blog_frontend_base_url)"
          gcloud run services update "blogger-agent-${ENVIRONMENT}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_GENAI_USE_VERTEXAI=True,BLOGGER_GCS_BUCKET=${GCS_BUCKET_BASE}-${ENVIRONMENT},BLOG_PUBLISH_URL=${BLOG_PUBLISH_URL},BLOG_TOKEN_AUDIENCE=${BLOG_TOKEN_AUDIENCE},BLOG_FRONTEND_BASE_URL=${BLOG_FRONTEND_BASE_URL},GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PAT},SERPAPI_API_KEY=${SERPAPI_KEY}"

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/blogger-agent:${{ steps.env.outputs.name }}-${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Terraform apply (deploy image)
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: terraform apply -auto-approve -var-file=terraform.tfvars -var-file=${{ steps.env.outputs.name }}.tfvars -var="image=${{ env.IMAGE }}"
